services:
  asterisk:
    build: .
    container_name: athenaphone-asterisk
    restart: unless-stopped

    # SIP and RTP through Docker's NAT is painful: the container advertises its
    # own address in SDP, which nothing outside the bridge can reach. On Linux,
    # host networking avoids the problem entirely. Everywhere else the ports
    # below are published and pjsip.conf rewrites the address using
    # ASTERISK_EXTERNAL_IP - see .env.example.
    ports:
      - "5060:5060/udp"     # SIP over UDP
      - "5060:5060/tcp"     # SIP over TCP
      - "5061:5061/tcp"     # SIP over TLS
      - "8088:8088/tcp"     # SIP over WS   (Asterisk's HTTP server)
      - "8089:8089/tcp"     # SIP over WSS
      - "5038:5038/tcp"     # AMI, for test assertions
      - "10000-10050:10000-10050/udp"  # RTP

    environment:
      # The address the phone will reach this server on. For a device on the
      # LAN that is the host machine's LAN IP, not 127.0.0.1.
      ASTERISK_EXTERNAL_IP: ${ASTERISK_EXTERNAL_IP:-127.0.0.1}

    volumes:
      - ./etc/pjsip.conf.template:/etc/asterisk/pjsip.conf.template:ro
      - ./etc/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./etc/http.conf:/etc/asterisk/http.conf:ro
      - ./etc/manager.conf:/etc/asterisk/manager.conf:ro
      - ./etc/modules.conf:/etc/asterisk/modules.conf:ro
      - ./etc/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./etc/logger.conf:/etc/asterisk/logger.conf:ro
      - ./tls:/etc/asterisk/keys:ro
