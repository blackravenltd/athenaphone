;
; The test dialplan. Each extension exercises one behaviour, so a test can
; assert on a single thing at a time.

[general]
static = yes
writeprotect = no

[globals]

[athenaphone-test]

; --------------------------------------------------------------- media tests

; 100 - Echo. Whatever you send comes back, audio and video.
; The round-trip check: send a known tone, assert it returns.
exten => 100,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; *43 is the conventional echo extension; keep it working too.
exten => *43,1,Goto(100,1)

; 101 - Milliwatt. A precise 1004 Hz tone at 0 dBm, forever.
;
; This is the one to assert on: decode the RTP, run an FFT, and check the peak
; is at 1004 Hz at the expected amplitude. That turns "is there audio?" into an
; exact measurement rather than a guess, so the test cannot pass on noise.
exten => 101,1,NoOp(Milliwatt 1004 Hz reference tone)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; 102 - Playback then hang up. Tests that a call ends cleanly from the far end
; and that the app reports remote-hangup rather than an error.
exten => 102,1,NoOp(Playback then remote hangup)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; -------------------------------------------------------------- DTMF round trip

; 103 - Read four digits, then say them back.
; Asserts DTMF in both directions: the server received what the app sent
; (check ${digits} via AMI or the log), and the app hears the readback.
exten => 103,1,NoOp(DTMF capture and readback)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(digits,beep,4,,1,10)
 same => n,NoOp(ATHENAPHONE_DTMF_RECEIVED=${digits})
 same => n,UserEvent(DtmfReceived,Digits: ${digits})
 same => n,SayDigits(${digits})
 same => n,Wait(1)
 same => n,Hangup()

; ------------------------------------------------------- call outcome tests
; Each of these drives one CallEndReason in the app.

; 104 - Busy. Expect 486 and endReason 'busy'.
exten => 104,1,NoOp(Busy)
 same => n,Busy()

; 105 - Congestion. Expect 503 and endReason 'unavailable' or 'network-error'.
exten => 105,1,NoOp(Congestion)
 same => n,Congestion()

; 106 - Ring forever without answering. Tests the app's no-answer timeout and
; that cancelling from the app sends CANCEL rather than BYE.
exten => 106,1,NoOp(Ring with no answer)
 same => n,Progress()
 same => n,Ringing()
 same => n,Wait(120)
 same => n,Hangup()

; 107 - Answer after a delay, so 180 Ringing is observed before 200 OK.
exten => 107,1,NoOp(Delayed answer)
 same => n,Ringing()
 same => n,Wait(5)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; 108 - Reject outright. Expect 603 and endReason 'rejected'.
exten => 108,1,NoOp(Decline)
 same => n,Hangup(21)

; ----------------------------------------------------------------- hold, MOH

; 109 - Answer and play music on hold, so the app can be put on hold and
; resumed while media is flowing and the re-INVITE observed.
exten => 109,1,NoOp(Music on hold)
 same => n,Answer()
 same => n,MusicOnHold()
 same => n,Hangup()

; ------------------------------------------------------------------ transfer

; 110 - A transfer target that identifies itself, so a blind transfer can be
; confirmed to have landed in the right place.
exten => 110,1,NoOp(Transfer target)
 same => n,Answer()
 same => n,UserEvent(TransferLanded,Channel: ${CHANNEL})
 same => n,Playback(demo-thanks)
 same => n,Milliwatt()
 same => n,Hangup()

; --------------------------------------------------------- calls between apps

; Dial another registered endpoint: 1001, 1002 or 1003.
; Use this to test app-to-app calls, and inbound ringing.
exten => _100[123],1,NoOp(Dialling endpoint ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; ------------------------------------------------------------------ fallback

exten => _X.,1,NoOp(No such test extension: ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup()

exten => i,1,Hangup()
exten => t,1,Hangup()
