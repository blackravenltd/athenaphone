;
; AMI, so tests can assert on what the *server* saw rather than only on what
; the app displayed. That distinction matters: "the app showed 1234" and "the
; PBX received 1234" are different claims, and only the second proves DTMF
; actually crossed the wire.
;
; Credentials are deliberately trivial. This fixture is for a development
; machine and must never be exposed to a network you do not control.

[general]
enabled = yes
webenabled = yes
port = 5038
bindaddr = 0.0.0.0

[athenaphone-test]
secret = athenaphone
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
permit = 10.0.0.0/255.0.0.0
read = all
write = all
