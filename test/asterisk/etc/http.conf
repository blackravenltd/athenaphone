;
; Asterisk serves SIP over WebSocket from its HTTP server, so the ws and wss
; transports in pjsip.conf are bound here rather than there.
;
; The WebSocket URI for an AthenaPhone account is therefore:
;   ws://<host>:8088/ws
;   wss://<host>:8089/ws

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088

tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.pem
tlsprivatekey = /etc/asterisk/keys/asterisk.key
