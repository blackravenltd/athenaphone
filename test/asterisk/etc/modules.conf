[modules]
autoload = yes

; chan_sip is deprecated, and leaving it loaded actively breaks this fixture in
; two ways:
;
;   1. It binds UDP 0.0.0.0:5060, competing with chan_pjsip's transport-udp for
;      the same port.
;   2. It registers the 'sip' WebSocket sub-protocol first, so
;      res_pjsip_transport_websocket cannot claim it and declines to load -
;      which removes SIP over WebSocket entirely, with nothing but a one-line
;      "declined to load" to say so.
;
; The second is the nastier of the two: everything looks healthy, Asterisk
; reports the ws and wss transports as configured, and WSS connections are
; simply refused.
noload => chan_sip.so

; Deprecated or irrelevant here, and only add noise to the startup log.
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => app_macro.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => res_adsi.so
noload => pbx_dundi.so
