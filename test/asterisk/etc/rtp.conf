[general]
; A deliberately small range: every port here has to be published by Docker,
; and publishing a few thousand UDP ports makes container start crawl. Fifty
; is plenty for a test fixture and matches docker-compose.yml.
rtpstart = 10000
rtpend = 10050

; ICE is required because AthenaPhone's media is WebRTC on every transport.
icesupport = yes

; No STUN or TURN server is configured: the fixture is reached directly, and
; host candidates plus the external address rewriting in pjsip.conf are
; enough. Add stunaddr here if you move the fixture behind a NAT.
